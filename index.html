<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>कपिलेश्वर महादेव मंदिर</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #111318;
            color: #ffffff;
            min-height: 100vh;
        }

        /* Login Section */
        #loginSection {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-container {
            background: #1a1e29;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            width: 380px;
            text-align: center;
            border: 1px solid #ff9900;
        }

        h2 {
            margin-bottom: 8px;
            color: #ff9900;
            font-size: 24px;
        }

        .subtitle {
            font-size: 13px;
            color: #b0b3c1;
            margin-bottom: 20px;
        }

        .mode-selector {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            background: #111318;
            padding: 5px;
            border-radius: 8px;
            border: 1px solid #2a2e3d;
        }

        .mode-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            color: #b0b3c1;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.3s ease;
        }

        .mode-btn.active {
            background: #ff9900;
            color: #111318;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #ffcc66;
        }

        input {
            width: 100%;
            padding: 12px;
            background: #111318;
            border: 1px solid #2a2e3d;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: border 0.3s;
        }

        input:focus {
            border-color: #ff9900;
        }

        .hidden {
            display: none;
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background: #ff9900;
            border: none;
            border-radius: 8px;
            color: #111318;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background: #e68a00;
        }

        /* Main Website Section */
        #appSection {
            display: none;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: #1a1e29;
            border-bottom: 2px solid #ff9900;
            border-radius: 10px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logout-btn {
            padding: 8px 15px;
            background: #ff4757;
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .logout-btn:hover {
            background: #ff6b81;
        }

        .content {
            margin-top: 40px;
            text-align: center;
        }

        .content h1 {
            color: #ff9900;
            margin-bottom: 15px;
        }

        .admin-badge {
            background: #ff4757;
            color: white;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
            margin-left: 10px;
        }
    </style>
</head>
<body>

    <!-- Login Section -->
    <div id="loginSection">
        <div class="login-container">
            <h2>ॐ कपिलेश्वर महादेव</h2>
            <div class="subtitle">मंदिर अधिकृत पोर्टल</div>
            
            <!-- Mode Selection Buttons -->
            <div class="mode-selector">
                <button type="button" id="publicBtn" class="mode-btn active" onclick="switchMode('public')">Public</button>
                <button type="button" id="privateBtn" class="mode-btn" onclick="switchMode('private')">Private</button>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <!-- Public Input Field -->
                <div id="publicField" class="input-group">
                    <label for="username">तुमचे नाव प्रविष्ट करा:</label>
                    <input type="text" id="username" placeholder="उदा. राहुल पाटील">
                </div>

                <!-- Private (Admin) Input Field -->
                <div id="privateField" class="input-group hidden">
                    <label for="adminCode">अ‍ॅडमिन कोड टाка:</label>
                    <input type="password" id="adminCode" placeholder="गुप्त कोड प्रविष्ट करा">
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">प्रवेश करा</button>
            </form>
        </div>
    </div>

    <!-- Main Website Section -->
    <div id="appSection">
        <header>
            <div class="user-info">
                <h2 id="welcomeText" style="margin:0; font-size: 20px;">स्वागत आहे</h2>
                <span id="roleBadge"></span>
            </div>
            <button class="logout-btn" onclick="handleLogout()">बाहेर पडा (Logout)</button>
        </header>

        <div class="content">
            <h1>श्री कपिलेश्वर महादेव मंदिर</h1>
            <p style="color: #b0b3c1; font-size: 18px;">हर हर महादेवा! तुम्ही यशस्वीरित्या पोर्टलमध्ये प्रवेश केला आहे.</p>
        </div>
    </div>

    <script>
        let currentMode = 'public';

        // Check if user is already logged in
        window.onload = function() {
            const savedUser = localStorage.getItem('templeUser');
            const savedRole = localStorage.getItem('templeRole');
            
            if (savedUser || savedRole) {
                showApp(savedUser || 'Admin', savedRole);
            }
        };

        function switchMode(mode) {
            currentMode = mode;
            const publicBtn = document.getElementById('publicBtn');
            const privateBtn = document.getElementById('privateBtn');
            const publicField = document.getElementById('publicField');
            const privateField = document.getElementById('privateField');

            if (mode === 'public') {
                publicBtn.classList.add('active');
                privateBtn.classList.remove('active');
                publicField.classList.remove('hidden');
                privateField.classList.add('hidden');
            } else {
                privateBtn.classList.add('active');
                publicBtn.classList.remove('active');
                privateField.classList.remove('hidden');
                publicField.classList.add('hidden');
            }
        }

        function handleLogin(event) {
            event.preventDefault();

            if (currentMode === 'public') {
                const name = document.getElementById('username').value.trim();
                if (name === '') {
                    alert('कृपया तुमचे नाव प्रविष्ट करा!');
                    return;
                }
                localStorage.setItem('templeUser', name);
                localStorage.setItem('templeRole', 'public');
                showApp(name, 'public');
            } else {
                const code = document.getElementById('adminCode').value.trim();
                // इथे तुमचा अ‍ॅडमिन कोड तपासेल (उदा. SANCHIT9129 किंवा हवा असलेला दुसरा कोड)
                if (code === 'SANCHIT9129') {
                    localStorage.setItem('templeUser', 'संचित (Admin)');
                    localStorage.setItem('templeRole', 'admin');
                    showApp('संचित (Admin)', 'admin');
                } else {
                    alert('चुकीचा कोड! कृपया योग्य अ‍ॅडमिन कोड टाका.');
                }
            }
        }

        function showApp(username, role) {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('appSection').style.display = 'block';
            document.getElementById('welcomeTextinnerText', 'स्वागत आहे, ' + username);
            
            const badge = document.getElementById('roleBadge');
            if (role === 'admin') {
                badge.innerHTML = '<span class="admin-badge">ADMIN</span>';
            } else {
                badge.innerHTML = '';
            }
        }

        function handleLogout() {
            localStorage.removeItem('templeUser');
            localStorage.removeItem('templeRole');
            document.getElementById('appSection').style.display = 'none';
            document.getElementById('loginSection').style.display = 'flex';
            document.getElementById('username').value = '';
            document.getElementById('adminCode').value = '';
            switchMode('public');
        }
    </script>
</body>
</html>
